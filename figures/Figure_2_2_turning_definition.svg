<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="120mm" viewBox="0 0 519 340" role="img" aria-labelledby="title desc">
<title id="title">本文的台风转向判定规则</title>
<desc id="desc">示意路径先向西北再向东北移动，转向前后24小时各有至少一度经度位移，并满足四个12小时段的经度方向条件。示意图不对应实际台风。</desc>
<defs>
<marker id="teal" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#007c83"/></marker>
<marker id="orange" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#d76c20"/></marker>
<marker id="gray" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0 0 L5 2.5 L0 5 Z" fill="#596c78"/></marker>
</defs>
<rect width="519" height="340" fill="white"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#263946">
<text x="20" y="18" font-size="6.8" font-weight="700">怎样判定台风发生转向？</text>
<text x="20" y="30" font-size="6.4" >按JMA路径识别：先向西、后向东，前后两个24 h窗口均向北移动。</text>
<g id="orientation">
<line x1="32" y1="80" x2="32" y2="49" stroke="#596c78" stroke-width="1" marker-end="url(#gray)"/>
<line x1="32" y1="80" x2="62" y2="80" stroke="#596c78" stroke-width="1" marker-end="url(#gray)"/>
<text x="28" y="44" font-size="6" >北</text><text x="66" y="82" font-size="6" >东</text>
</g>
<g id="longitude-projections">
<line x1="100" y1="48" x2="100" y2="282" stroke="#b6c4ca" stroke-dasharray="3 3" stroke-width="0.7"/>
<line x1="225" y1="50" x2="225" y2="282" stroke="#b6c4ca" stroke-dasharray="3 3" stroke-width="0.7"/>
<line x1="100" y1="280" x2="225" y2="280" stroke="#007c83" stroke-width="1"/>
<line x1="100" y1="276" x2="100" y2="284" stroke="#007c83" /><line x1="225" y1="276" x2="225" y2="284" stroke="#007c83" />
<text x="114" y="293" font-size="6.2" >前24 h：向西 ≥ 1°经度</text>
<line x1="100" y1="55" x2="225" y2="55" stroke="#d76c20" stroke-width="0.8"/>
<line x1="100" y1="51" x2="100" y2="59" stroke="#d76c20" /><line x1="225" y1="51" x2="225" y2="59" stroke="#d76c20" />
<text x="112" y="46" font-size="6.2" >后24 h：向东 ≥ 1°经度</text>
</g>
<g id="track">
<line x1="225" y1="260" x2="180" y2="238" stroke="#007c83" stroke-width="2" /><line x1="180" y1="238" x2="140" y2="215" stroke="#007c83" stroke-width="2" marker-end="url(#teal)"/><line x1="140" y1="215" x2="115" y2="188" stroke="#007c83" stroke-width="2" /><line x1="115" y1="188" x2="100" y2="160" stroke="#007c83" stroke-width="2" marker-end="url(#teal)"/><line x1="100" y1="160" x2="115" y2="132" stroke="#d76c20" stroke-width="2" /><line x1="115" y1="132" x2="140" y2="105" stroke="#d76c20" stroke-width="2" marker-end="url(#orange)"/><line x1="140" y1="105" x2="180" y2="78" stroke="#d76c20" stroke-width="2" /><line x1="180" y1="78" x2="225" y2="50" stroke="#d76c20" stroke-width="2" marker-end="url(#orange)"/>
<circle cx="225" cy="260" r="3" fill="white" stroke="#007c83" stroke-width="1.2"/><circle cx="180" cy="238" r="1.8" fill="white" stroke="#007c83" stroke-width="1.2"/><circle cx="140" cy="215" r="3" fill="white" stroke="#007c83" stroke-width="1.2"/><circle cx="115" cy="188" r="1.8" fill="white" stroke="#007c83" stroke-width="1.2"/><circle cx="100" cy="160" r="4.5" fill="white" stroke="#263946" stroke-width="1.8"/><circle cx="115" cy="132" r="1.8" fill="white" stroke="#d76c20" stroke-width="1.2"/><circle cx="140" cy="105" r="3" fill="white" stroke="#d76c20" stroke-width="1.2"/><circle cx="180" cy="78" r="1.8" fill="white" stroke="#d76c20" stroke-width="1.2"/><circle cx="225" cy="50" r="3" fill="white" stroke="#d76c20" stroke-width="1.2"/>
<text x="233" y="263" font-size="6.4" >−24 h</text><text x="110" y="230" font-size="6.4" >−12 h</text>
<text x="30" y="158" font-size="6.4" font-weight="700">转向时刻 t₀</text><text x="30" y="169" font-size="6" >西行转为东行</text>
<text x="150" y="108" font-size="6.4" >+12 h</text><text x="233" y="48" font-size="6.4" >+24 h</text>
<text x="130" y="260" font-size="6" >向西、向北</text><text x="170" y="100" font-size="6" >向东、向北</text>
</g>
<line x1="288" y1="45" x2="288" y2="295" stroke="#d5dfe3" stroke-width="0.8"/>
<g id="rules">
<text x="306" y="57" font-size="6.8" font-weight="700">① 前后24 h的总位移</text>
<text x="306" y="72" font-size="6.4" >此前：向西至少1°经度，且向北。</text>
<text x="306" y="85" font-size="6.4" >此后：向东至少1°经度，且向北。</text>
<text x="306" y="112" font-size="6.8" font-weight="700">② 四个12 h时段的方向</text>
<text x="306" y="129" font-size="6.4" >−24 → −12 h、−12 → 0 h：</text>
<text x="306" y="142" font-size="6.4" >每段经度变化 ≤ 0（不向东）。</text>
<text x="306" y="159" font-size="6.4" >0 → +12 h、+12 → +24 h：</text>
<text x="306" y="172" font-size="6.4" >每段经度变化 ≥ 0（不向西）。</text>
<text x="306" y="211" font-size="6.8" font-weight="700">③ 有多个候选点时</text>
<text x="306" y="228" font-size="6.4" >选最靠西者；经度相同选最早者。</text>
</g>
<rect x="20" y="307" width="479" height="22" rx="3" fill="#f3f7f8"/>
<text x="30" y="321" font-size="6" >圆点间隔为6 h；t₀表示转向时刻。示意路径用于说明判定规则，不对应某个实际台风。</text>
</g></svg>